# Regenerate the platform icons after redrawing assets/icon/icon.png
# (swift assets/icon/draw.swift assets/icon/icon.png):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ adaptive icon: the same artwork, inset so the launcher mask
  # doesn't crop the arrows, over the artwork's own background colour.
  adaptive_icon_background: "#048389"
  adaptive_icon_foreground: assets/icon/icon.png
  adaptive_icon_foreground_inset: 20
  web:
    generate: true
    background_color: "#048389"
    theme_color: "#00897B"
