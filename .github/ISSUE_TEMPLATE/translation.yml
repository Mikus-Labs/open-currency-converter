name: Translation
description: A wrong or awkward translation, or a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. German
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: The current text, where it appears, and your suggested text.
    validations:
      required: true
