name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      placeholder: e.g. Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in your device's app info, or the release you installed.
      placeholder: e.g. 1.0.0
