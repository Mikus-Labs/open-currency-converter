name: Release

# Push a tag like v1.2.0 to build signed store artifacts and open a draft
# GitHub Release. Tag builds skip iOS until its signing secrets exist, so
# Android can ship first. A manual run builds the same artifacts without a
# release and, if signing secrets are missing, falls back to test builds
# (debug-signed APK, unsigned iOS) so the pipeline can be checked before store
# accounts exist. Setup and secrets: docs/RELEASING.md.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (iOS runs on macOS, which costs 10x the minutes)
        type: choice
        options: [android, all]
        default: android

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: io.github.zacharymikus.openconverter
  # Store builds must be signed; only manual runs may fall back to test builds.
  SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      number: ${{ steps.v.outputs.number }}
      ios: ${{ steps.ios.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: ios
        env:
          HAS_IOS_SECRETS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # Manual runs build iOS only when asked; tag runs whenever it can be signed.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            build=$([[ "$PLATFORMS" == all ]] && echo true || echo false)
          else
            build="$HAS_IOS_SECRETS"
            if [[ "$build" != true ]]; then
              echo "::notice::No iOS signing secrets: this release is Android only."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$name' must look like 1.2.3"
            exit 1
          fi
          # Both stores require the build number to increase on every upload.
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Version $name (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android (AAB + APK)
    # Runs alongside the tests (Linux minutes are cheap); nothing ships unless both pass.
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # Gradle dependencies are most of the Android build time.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          # Separate from the test job's cache so it keeps the Android engine
          # files Flutter downloads on the first Android build.
          cache-key: 'flutter-android-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$SIGNING_REQUIRED" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
              exit 1
            fi
            echo "::warning::No Android keystore secret: building a debug-signed test APK that can't go to Play."
            echo "SUFFIX=-debugsigned" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(--release --build-name "$VERSION" --build-number "$BUILD_NUMBER")
          flutter build appbundle "${args[@]}"
          # One APK per processor type: a third of the size of a universal APK.
          flutter build apk --split-per-abi "${args[@]}"

      - name: Verify signature and collect artifacts
        run: |
          mkdir -p dist
          aab=build/app/outputs/bundle/release/app-release.aab
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          signers="$(keytool -printcert -jarfile "$aab" | grep -m1 'Owner:')"
          echo "AAB signed by $signers"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            signer="$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate DN:')"
            echo "$abi APK $signer"
            signers="$signers $signer"
            cp "$apk" "dist/open-converter-$VERSION-$BUILD_NUMBER-$abi$SUFFIX.apk"
          done
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [[ "$signers" == *"Android Debug"* ]]; then
            echo "::error::Release build is debug-signed even though a keystore was provided."
            exit 1
          fi
          if [ -z "${SUFFIX:-}" ]; then
            cp "$aab" "dist/open-converter-$VERSION-$BUILD_NUMBER.aab"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

  smoke:
    name: Android smoke test
    needs: android
    uses: ./.github/workflows/android-smoke.yml
    with:
      # Tests the APK that ships, rather than building another.
      artifact: android

  ios:
    name: iOS (IPA)
    needs: [test, version]
    if: needs.version.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            if [ "$SIGNING_REQUIRED" = "true" ]; then
              echo "::error::iOS signing secrets are not set. See docs/RELEASING.md."
              exit 1
            fi
            echo "::warning::No iOS signing secrets: doing an unsigned test build only (no IPA)."
            echo "IOS_UNSIGNED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # Put the signing keychain first in the search list, keeping the existing ones.
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/dist.p12"

          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          if [ "$app_id" != "$team.$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile is for '$app_id', expected '$team.$BUNDLE_ID'."
            exit 1
          fi
          # Xcode 16+ reads profiles from UserData; older tools from MobileDevice.
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done

          {
            echo "IOS_KEYCHAIN=$keychain"
            echo "IOS_TEAM_ID=$team"
            echo "IOS_PROFILE_NAME=$name"
          } >> "$GITHUB_ENV"
          echo "Signing with team $team, profile '$name'"

      - name: Configure manual signing
        if: env.IOS_UNSIGNED != 'true'
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby scripts/ci/configure_ios_signing.rb ios/Runner.xcodeproj "$IOS_TEAM_ID" "$IOS_PROFILE_NAME"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build IPA
        if: env.IOS_UNSIGNED != 'true'
        run: |
          flutter build ipa --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/open-converter-$VERSION-$BUILD_NUMBER.ipa"
          ls -l dist

      - name: Unsigned test build
        if: env.IOS_UNSIGNED == 'true'
        run: flutter build ios --release --no-codesign --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      - uses: actions/upload-artifact@v7
        if: env.IOS_UNSIGNED != 'true'
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

      - name: Remove signing keychain and profile
        if: always()
        run: |
          if [ -n "${IOS_KEYCHAIN:-}" ]; then security delete-keychain "$IOS_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"

  publish:
    name: Draft GitHub Release
    # Runs when iOS was skipped too, as long as nothing failed.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.test.result == 'success' && needs.android.result == 'success'
      && needs.smoke.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.ios.result)
    needs: [test, version, android, smoke, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: Converter ${{ needs.version.outputs.name }} (build ${{ needs.version.outputs.number }})
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
