# Flutter localisation (flutter gen-l10n). lib/l10n/app_en.arb is the
# template; each translation is lib/l10n/app_<locale>.arb. See docs/LOCALISATION.md.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
# Every template message needs a description, which is the translator's context.
required-resource-attributes: true
format: true
untranslated-messages-file: build/l10n_untranslated.json
